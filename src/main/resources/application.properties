spring.application.name=clinic-api
spring.jpa.open-in-view=true

# DATASOURCE
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-c%20timezone=America/Recife
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA, SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# SECURITY
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration.in.minutes=${JWT_EXPIRATION_IN_MINUTES}

# OAUTH2
# Google configuration
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

google.client.id=${OAUTH2_GOOGLE_CLIENT_ID}



# AWS INFRA
aws.endpoint=${AWS_ENDPOINT:http://localhost:4566}
aws.region=${AWS_REGION:sa-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:raio_x_storage}
